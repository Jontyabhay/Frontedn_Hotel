<main class="chef-page">
 <div class="brand" aria-label="bitely">
  🍴 bite<span>ly</span>
</div>

  <h1>Chef login</h1>

  <form (ngSubmit)="login()" #form="ngForm">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      [(ngModel)]="username"
      required
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
    />

    @if (error) {
      <p role="alert">{{ error }}</p>
    }

    <button type="submit" [disabled]="form.invalid || isLoggingIn()">
      {{ isLoggingIn() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</main>
